<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Camarita · embed</title>
    <style>
        :root {
            --accent: #5eead4;
            --ok: #34d399;
            --warning: #fbbf24;
            --danger: #fb7185;
            --muted: #94a3b8;
            --font: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            color: #e8eef8;
            font-family: var(--font);
            overflow: hidden;
        }

        #embed {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
            gap: 2px;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .cell {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #02040a;
            overflow: hidden;
        }

        camarita-player,
        camarita-player video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        camarita-player video {
            object-fit: contain;
            background: #000;
        }

        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 26%, transparent 68%, rgba(0,0,0,.65));
            transition: opacity 180ms ease;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 999px;
            background: rgba(2,6,12,.55);
            backdrop-filter: blur(6px);
            font-size: .62rem;
            font-weight: 750;
            letter-spacing: .1em;
        }

        .live i {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--muted);
        }

        .cell[data-status="live"] .live i {
            background: var(--ok);
            animation: pulse 1.8s ease-in-out infinite;
        }

        .cell[data-status="connecting"] .live i {
            background: var(--warning);
            animation: pulse 1.2s ease-in-out infinite;
        }

        .cell[data-status="error"] .live i { background: var(--danger); }

        .quality {
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(94,234,212,.92);
            color: #03211b;
            font-size: .62rem;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .quality.sd {
            background: rgba(30,64,175,.7);
            color: #dbeafe;
            border: 1px solid rgba(147,197,253,.25);
        }

        .bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 10px;
        }

        .name {
            font-size: .82rem;
            font-weight: 700;
            text-shadow: 0 1px 10px rgba(0,0,0,.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta {
            margin-top: 2px;
            color: #b6c3d6;
            font-size: .64rem;
            font-variant-numeric: tabular-nums;
        }

        .fs {
            pointer-events: auto;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 9px;
            background: rgba(2,6,12,.58);
            color: #dbe4f0;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }

        .fs svg { width: 15px; height: 15px; }

        .error {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 18px;
            text-align: center;
            background: rgba(2,6,12,.88);
            font-size: .72rem;
            color: #cbd5e1;
        }

        .cell[data-status="error"] .error { display: flex; }
        .cell[data-status="error"] .overlay { opacity: 0; }

        .error strong { color: #fecdd3; font-size: .8rem; }

        .empty {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            color: var(--muted);
            font-size: .82rem;
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        @media (hover: none) {
            .overlay { padding: 8px; }
        }
    </style>
</head>
<body>
    <div id="embed"></div>
    <div id="empty" class="empty" hidden></div>

    <script type="module" src="js/embed.js?v=1.1.1"></script>
</body>
</html>
