# ============================================================================
# Plantilla Nginx para publicar Camarita cuando pase de host:puerto a un
# dominio propio. NO se usa en la configuración habitual: go2rtc ya sirve la
# interfaz desde el mismo contenedor.
#
# Modo de uso (por si algún día quieres dominio + HTTPS):
#
#   1. Añade un servidor nginx en la misma red docker que camarita, p. ej.:
#        nginx:
#          image: nginx:stable-alpine
#          ports: ["80:80"]
#          volumes:
#            - ./nginx.conf:/etc/nginx/nginx.conf:ro
#      (hay una config comentada al final de compose.yaml)
#
#   2. Cambia server_name por tu dominio o déjalo como _ .
#
#   3. HTTPS: configura TLS en este archivo o usa un proxy (Traefik, etc.).
#      Importante: MSE y WebRTC con cámaras requieren HTTPS (o localhost)
#      fuera de localhost; el vídeo no pasa por nginx, pero el navegador
#      lo exige.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Si según el día algo falla con el streaming, prueba quitando el gzip:
    # go2rtc entrega fMP4/HLS continuos y gzip ahorra poco ahí.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        # Cambia por tu dominio, p. ej. camaras.tudominio.com
        server_name _;

        # Estáticos que son archivos de verdad (favicon, css...); opcional.
        location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp|woff2)$ {
            proxy_pass http://camarita:1984;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Todo lo demás va al contenedor de Camarita:
        #  - la interfaz (index.html, embed.html, cameras.json)
        #  - /api/ws → WebSocket de streaming; las cabeceras Upgrade son
        #    obligatorias, sin ellas el vídeo no funciona.
        location / {
            proxy_pass http://camarita:1984;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Sin límites de tiempo: una emisión en directo puede durar horas.
            proxy_read_timeout 7d;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}

# ----------------------------------------------------------------------------
# En compose.yaml, cuando hagas la migración a dominio, añade:
#
#   nginx:
#     image: nginx:stable-alpine
#     restart: unless-stopped
#     depends_on: [camarita]
#     ports:
#       - "80:80"
#     volumes:
#       - ./nginx.conf:/etc/nginx/nginx.conf:ro
# ----------------------------------------------------------------------------

